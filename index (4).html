<style>
/* Layout: full-bleed landscape canvas; thumb stick on the left, skill buttons on the right */
:root {
  --deep: #06161b;
  --sea: #0f2f38;
  --wave: #1b4a56;
  --sand: #c9b27c;
  --fire: #ff7a1a;
  --ember: #ffd166;
  --ink: #f4ecd8;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--deep);
  color: var(--ink);
  font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#stage { position: relative; width: 100%; height: 100%; }
#c { display: block; touch-action: none; background: var(--deep); }
#rot {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; text-align: center;
  background: var(--deep); padding: 24px; box-sizing: border-box;
}
#rot .ph {
  width: 54px; height: 90px; border: 3px solid var(--ember); border-radius: 10px;
  animation: turn 2.4s ease-in-out infinite;
}
#rot p { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.6; text-wrap: balance; }
@keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
@media (prefers-reduced-motion: reduce) { #rot .ph { animation: none; transform: rotate(90deg); } }
</style>

<div id="stage">

<script>
(() => {

}

const dist = (a, b, c, d) => Math.hypot(a - c, b - d);

function hurtPlayer(d, melee, haki) {

  P.hp -= d; P.inv = 0.5; P.hurt = 0.25; P.lastHurt = t; shake = Math.max(shake, 6);

}
function gainXp(v) {

    spark(P.x, P.y, 26, C.ember, 220, 0.7, 5);

  if (lv0 < 10 && P.lv >= 10 && !P.parkSeen) say('Lv10到達！ 新しい島へ行ける！ コンパスの矢印を追え');

function gainMastery(kind, v) {

// ギザギザの稲妻（空から地面まで、枝分かれ付き）
function makeBolt(x, y, big) {
  boltCount++;
  const top = y - (big ? 460 : 400), n = big ? 13 : 10, sx = x + rnd(-40, 40), pts = [{ x: sx, y: top }];
  for (let i = 1; i < n; i++) {
    const k = i / n;
    pts.push({ x: sx + (x - sx) * k + rnd(-1, 1) * (big ? 34 : 24) * (1 - k * 0.3), y: top + (y - top) * k });
  }
  pts.push({ x, y });
  const br = [], nb = big ? 6 : 3;
  for (let b = 0; b < nb; b++) {
    const o = pts[2 + Math.floor(Math.random() * (n - 4))], dir = Math.random() < 0.5 ? -1 : 1, seg = [{ x: o.x, y: o.y }];
    let bx = o.x, by = o.y;
    for (let q = 0; q < 4; q++) { bx += dir * rnd(8, 26); by += rnd(10, 26); seg.push({ x: bx, y: by }); }
    br.push(seg);
  }
  const life = big ? 0.55 : 0.3;
  bolts.push({ pts, br, life, max: life, big });
}
function thunderStrike(x, y, r, dmgv, big) {
  makeBolt(x, y, big);
  waves.push({ x, y, max: r * 1.15, life: 0.32, max0: 0.32 });
  flashA = Math.max(flashA, big ? 0.55 : 0.16);
  shake = Math.max(shake, big ? 14 : 4);
  spark(x, y, big ? 40 : 10, FR.thunder.hiHex, big ? 260 : 160, 0.5, big ? 5 : 3);
  spark(x, y, big ? 20 : 5, FR.thunder.hex, 200, 0.6, 3);
  for (const e of enemies) {
    if (e.dead || dist(x, y, e.x, e.y) >= r + e.r) continue;
    damageEnemy(e, dmgv, true, 'fruit');
    if (big) { const a = Math.atan2(e.y - y, e.x - x), kb = e.boss ? 80 : 220; e.kx = Math.cos(a) * kb; e.ky = Math.sin(a) * kb; }
  }
  sfxBolt(big);
}
function stormBolt() {
  let x, y;
  const cand = enemies.filter(e => !e.dead && dist(e.x, e.y, storm.x, storm.y) < 380);
  if (cand.length && Math.random() < 0.6) { const e = cand[Math.floor(Math.random() * cand.length)]; x = e.x + rnd(-14, 14); y = e.y + rnd(-14, 14); }
  else { const a = rnd(0, TAU), d = Math.sqrt(Math.random()) * 340; x = storm.x + Math.cos(a) * d; y = storm.y + Math.sin(a) * d; }
  thunderStrike(x, y, 46, dmg() * 1.7, false);
}
function orbBoom() {
  thunderStrike(storm.x, storm.y, 300, dmg() * 8, true);
  for (const e of enemies) if (!e.dead && dist(storm.x, storm.y, e.x, e.y) < 300 + e.r) e.stun = Math.max(e.stun, e.boss ? 0.4 : 1.2);
  waves.push({ x: storm.x, y: storm.y, max: 200, life: 0.45, max0: 0.45 }, { x: storm.x, y: storm.y, max: 120, life: 0.3, max0: 0.3 });
  flashA = 0.95; shake = 24;
  spark(storm.x, storm.y, 90, FR.thunder.hiHex, 420, 0.9, 6); spark(storm.x, storm.y, 50, FR.thunder.hex, 320, 1, 5);
  storm.orbDone = true;
}

function updateMagma(dt) {

  }
  mshots = mshots.filter(s => !s.dead);

        if (e.dead || dist(p.x, p.y, e.x, e.y) > p.r + e.r * 0.6 || (e.mgT || 0) > t) continue;

}

    if (P.lv >= 90 && !P.baseSeen && dist(P.x, P.y, HATCH.x, HATCH.y) < 420 && Math.random() < dt * 3) spark(HATCH.x + rnd(-30, 30), HATCH.y + rnd(-18, 18), 1, '#d6b8ff', 20, 0.8, 2, 14);
    if (!P.townSeen && inTown(P.x, P.y, -100)) { P.townSeen = true; say('夕暮れの街に到着！ 街の偉い人に話しかけてみよう'); save(); }
    if (!P.schoolSeen && inSchool(P.x, P.y, -80)) { P.schoolSeen = true; say('学校に到着！ 校長に話しかけてみよう'); save(); }
    if (Math.hypot(m.x, m.y) > 0.15 && inPark(P.x, P.y, 0) && gate('bush', 0.2) && pbush.some(b => dist(P.x, P.y, b.x, b.y) < b.r + 6)) {
      const a = audio(); if (a) try { hiss(a, 'highpass', 3000, 5500, a.currentTime, 0.12, 0.07); } catch (e) {}
    }

    spawnT -= dt;
    if (spawnT <= 0) { spawnEnemy(); spawnT = Math.max(0.5, 1.6 - P.lv * 0.08); }
    saveT -= dt;
    if (saveT <= 0) { saveT = 4; save(); }
  }

  // 海軍兵の再出現（倒されて3秒後）
  for (const s of pen) {
    if (s.e && s.e.dead) { s.e = null; s.res = 3; }
    if (!s.e) {
      s.res -= dt;
      if (s.res <= 0) { s.e = makeMarine(s); enemies.push(s.e); }
    }
  }

  // 噴水公園の敵の再出現（店員3秒 / 透明な人5秒 / 店主60秒）
  for (const q of pslots) {
    if (q.e && q.e.dead) { q.e = null; q.res = q.rs; }
    if (!q.e) { q.res -= dt; if (q.res <= 0) { q.e = makePark(q); enemies.push(q.e); } }
  }

  // 牢獄の敵の再出現（脱走者4秒 / 組織の部下2秒 / ボス1分半）
  for (const q of jslots) {
    if (q.e && q.e.dead) { q.e = null; q.res = q.rs; }
    if (!q.e) { q.res -= dt; if (q.res <= 0) { q.e = makePrison(q); enemies.push(q.e); } }
  }
  for (const q of sslots) {
    if (q.e && q.e.dead) { q.e = null; q.res = q.rs; }
    if (!q.e) { q.res -= dt; if (q.res <= 0) { q.e = makeSchool(q); enemies.push(q.e); } }
  }
  for (const q of tslots) {
    if (q.e && q.e.dead) { q.e = null; q.res = q.rs; }
    if (!q.e) { q.res -= dt; if (q.res <= 0) { q.e = makeTown(q); enemies.push(q.e); } }
  }
  for (const q of bslots) {
    if (q.e && q.e.dead) { q.e = null; q.res = q.rs; }
    if (!q.e) { q.res -= dt; if (q.res <= 0) { q.e = makeBase(q); enemies.push(q.e); } }
  }
  for (const z of bzones) { z.t += dt; if (z.t >= z.max && !z.done) { z.done = true; darkStrike(z); } }
  bzones = bzones.filter(z => !z.done);
  for (const f of bfx) f.t += dt;
  bfx = bfx.filter(f => f.t < f.max);
  fadeA = Math.max(0, fadeA - dt * 1.4);
  duskA += ((inTown(P.x, P.y, 0) ? 1 : 0) - duskA) * Math.min(1, dt * 2);
  for (const z of szones) { z.t += dt; if (z.t >= z.max && !z.done) { z.done = true; foeStrike(z.x, z.y, z.r, z.dmg, z.big); } }
  szones = szones.filter(z => !z.done);
  for (const b of booms) b.t += dt;
  booms = booms.filter(b => b.t < b.max);

  // enemies
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.peer) { e.flash = Math.max(0, e.flash - dt); continue; }
    e.flash = Math.max(0, e.flash - dt);
    e.cd -= dt; e.slow = Math.max(0, e.slow - dt); e.stun = Math.max(0, e.stun - dt); e.qk = Math.max(0, (e.qk || 0) - dt);
    if (e.punch > 0) e.punch -= dt;
    if (e.burn > 0) {
      e.burn -= dt; e.bt -= dt;
      if (Math.random() < dt * 12) spark(e.x, e.y - 4, 1, FR.fire.hex, 24, 0.4, 3, 28);
      if (e.bt <= 0) { e.bt = 0.5; damageEnemy(e, Math.max(1, dmg() * 0.5), false); if (e.dead) continue; }
    }
    if (e.stun > 0 && !(e.frz > 0) && Math.random() < dt * 16) spark(e.x + rnd(-8, 8), e.y - e.r - 4, 1, FR.thunder.hiHex, 30, 0.3, 2);
    if (e.slow > 0 && Math.random() < dt * 8) spark(e.x + rnd(-8, 8), e.y + rnd(-6, 6), 1, FR.ice.hiHex, 20, 0.4, 2);
    if (e.frz > 0) { e.frz -= dt; e.stun = Math.max(e.stun, 0.06); if (Math.random() < dt * 10) spark(e.x + rnd(-8, 8), e.y + rnd(-8, 8), 1, FR.ice.hiHex, 20, 0.4, 2); }   // 氷結中は動けない
    if ((e.jboss || e.sboss || e.bboss || e.tmayor) && e.stun > 0.3) e.stun = 0.3;
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    let vx = 0, vy = 0;
    if (e.stray) {
      const pv = strayDuelAI(e, dt, dx, dy, d); vx = pv[0]; vy = pv[1];
    } else if (e.park) {
      const dh = dist(e.x, e.y, e.hx, e.hy);
      if ((e.lastHit !== null && t - e.lastHit > 35) || dh > 400) { resetMarine(e); continue; }
      const pv = parkAI(e, dt, dx, dy, d, dh); vx = pv[0]; vy = pv[1];
    } else if (e.sch) {
      const dh = dist(e.x, e.y, e.hx, e.hy);
      if ((e.lastHit !== null && t - e.lastHit > 35) || dh > (e.sboss ? 800 : 560)) { resetMarine(e); continue; }
      const pv = schoolAI(e, dt, dx, dy, d, dh); vx = pv[0]; vy = pv[1];
    } else if (e.tw) {
      const dh = dist(e.x, e.y, e.hx, e.hy);
      if ((e.lastHit !== null && t - e.lastHit > 35) || dh > (e.tmayor ? 800 : 560)) { resetMarine(e); continue; }
      const pv = townAI(e, dt, dx, dy, d, dh); vx = pv[0]; vy = pv[1];
    } else if (e.bas) {
      const dh = dist(e.x, e.y, e.hx, e.hy);
      if ((e.lastHit !== null && t - e.lastHit > 35) || dh > (e.bboss ? 800 : 560)) { resetMarine(e); continue; }
      const pv = baseAI(e, dt, dx, dy, d, dh); vx = pv[0]; vy = pv[1];
    } else if (e.pri) {
      const dh = dist(e.x, e.y, e.hx, e.hy);
      if ((e.lastHit !== null && t - e.lastHit > 35) || dh > (e.jboss ? 700 : 520)) { resetMarine(e); continue; }
      const pv = prisonAI(e, dt, dx, dy, d, dh); vx = pv[0]; vy = pv[1];
    } else if (e.type === 'marine') {
      const dh = dist(e.x, e.y, e.hx, e.hy);
      // 元の位置に再スポーン: 最後の被弾から35秒経過、または持ち場から遠く離れた
      if ((e.lastHit !== null && t - e.lastHit > 35) || dh > 300) { resetMarine(e); continue; }
      if (e.st === 'idle') {
        if (state === 'play' && d < 190) { e.st = 'chase'; e.chaseT = 5; }
      } else if (e.st === 'chase') {
        e.chaseT -= dt;
        if (state !== 'play' || e.chaseT <= 0) e.st = 'return';
        else {
          vx = dx / d * e.spd; vy = dy / d * e.spd;
          if (d < e.r + P.r + 8 && e.cd <= 0 && e.stun <= 0) { e.cd = 1; e.punch = 0.15; hurtPlayer(e.d, true, e.haki); }
        }
      } else {
        const hd = dh || 1;
        vx = (e.hx - e.x) / hd * e.spd * 1.4; vy = (e.hy - e.y) / hd * e.spd * 1.4;
        if (dh < 8) { e.st = 'idle'; e.x = e.hx; e.y = e.hy; vx = 0; vy = 0; }
      }
    } else if (state === 'play') {
      if (e.type === 'archer') {
        if (d > 250) { vx = dx / d * e.spd; vy = dy / d * e.spd; }
        else if (d < 170) { vx = -dx / d * e.spd; vy = -dy / d * e.spd; }
        else { vx = -dy / d * e.spd * 0.5; vy = dx / d * e.spd * 0.5; }

          e.cd = 2.2;

        }
      } else if (e.boss) {
        if (e.charge > 0) { e.charge -= dt; vx = e.cx; vy = e.cy; }
        else {
          vx = dx / d * e.spd; vy = dy / d * e.spd;
          e.bt2 = (e.bt2 || 0) - dt; e.bt3 = (e.bt3 || 0) - dt;
          if (e.bt2 <= 0 && e.stun <= 0) {
            e.bt2 = 3.5;
            for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; eshots.push({ x: e.x, y: e.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, life: 3, r: 7, dmg: e.d * 0.6 }); }
          }
          if (e.bt3 <= 0 && d < 420) { e.bt3 = 7; e.charge = 0.6; e.cx = dx / d * 380; e.cy = dy / d * 380; }
        }
      } else { vx = dx / d * e.spd; vy = dy / d * e.spd; }
      if (e.type !== 'archer' && d < e.r + P.r + 2 && e.cd <= 0 && e.stun <= 0) { e.cd = 0.9; hurtPlayer(e.d, true, e.haki); }
    }
    const sm = e.stun > 0 ? 0 : Math.min(e.slow > 0 ? 0.4 : 1, e.qk > 0 ? 0.3 : 1);   // 揺れ地面の中は移動速度-70%
    const kr = e.kres || 1;
    e.x += (vx * sm + e.kx * kr) * dt; e.y += (vy * sm + e.ky * kr) * dt;
    e.kx *= Math.pow(0.02, dt); e.ky *= Math.pow(0.02, dt);
    e.x = clamp(e.x, 20, WW - 20); e.y = clamp(e.y, 20, WH - 20);
    pushOutRocks(e, e.r); pushOutSolids(e, e.r);
  }
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (a.dead) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]; if (b.dead) continue;
      const d = dist(a.x, a.y, b.x, b.y), m = a.r + b.r;
      if (d < m && d > 0.01) { const p = (m - d) / 2 / d; a.x += (a.x - b.x) * p; a.y += (a.y - b.y) * p; b.x -= (a.x - b.x) * p; b.y -= (a.y - b.y) * p; }
    }
  }

  // fruit balls
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (Math.random() < 0.8) spark(s.x, s.y, 1, fc().hex, 30, 0.3, 4);
    for (const k of rocks) if (dist(s.x, s.y, k.x, k.y) < k.r + s.r) { s.life = 0; spark(s.x, s.y, 8, fc().hex, 140, 0.4, 4); }
    if (s.life <= 0) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      if (dist(s.x, s.y, e.x, e.y) < e.r + s.r) {
        s.life = 0;
        damageEnemy(e, s.dmg, true, 'fruit');
        for (const o of enemies) if (o !== e && !o.dead && dist(s.x, s.y, o.x, o.y) < 44 + o.r) damageEnemy(o, s.dmg * 0.5, true, 'fruit');
        spark(s.x, s.y, 16, fc().hiHex, 200, 0.5, 5);
        break;
      }
    }
  }
  shots = shots.filter(s => s.life > 0 && s.x > 0 && s.y > 0 && s.x < WW && s.y < WH);

  for (const s of eshots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (state === 'play' && dist(s.x, s.y, P.x, P.y) < s.r + P.r) { s.life = 0; hurtPlayer(s.dmg, !!s.phys, false); }   // phys=銃弾など物理攻撃: 覇気がないのでロギアは無効化
    for (const k of rocks) if (dist(s.x, s.y, k.x, k.y) < k.r + s.r) s.life = 0;
  }
  eshots = eshots.filter(s => s.life > 0);

  for (const p of pillars) {
    p.t -= dt;
    if (p.t <= 0) {
      if (p.thunder) thunderStrike(p.x, p.y, p.r, p.dmg, true);
      else for (const e of enemies) if (!e.dead && dist(p.x, p.y, e.x, e.y) < p.r + e.r) { damageEnemy(e, p.dmg, true, 'fruit'); e.ky = -60; }
      sfxSkill('pillarHit', P.fr.id);
      spark(p.x, p.y, 30, fc().hex, 180, 0.7, 6, 80); spark(p.x, p.y, 14, fc().hiHex, 120, 0.6, 5, 120);
      trails.push({ x: p.x, y: p.y, life: 1.2, r: 40 });
      shake = Math.max(shake, 5);
    }
  }
  pillars = pillars.filter(p => p.t > 0);

  for (const r of rings) {
    r.r += 520 * dt;
    for (const e of enemies) {
      if (e.dead || r.hit.has(e)) continue;
      if (dist(r.x, r.y, e.x, e.y) < r.r + e.r) {
        r.hit.add(e); damageEnemy(e, r.dmg, r.fruit, r.src); if (!r.fruit) sfxHit(true);
        const a = Math.atan2(e.y - r.y, e.x - r.x), kb = (r.kb || 320) * (e.boss ? 0.35 : 1);
        e.kx = Math.cos(a) * kb; e.ky = Math.sin(a) * kb;
      }
    }
    for (const s of eshots) if (dist(r.x, r.y, s.x, s.y) < r.r) s.life = 0;
  }
  rings = rings.filter(r => r.r < r.max);

  for (const z of trails) {
    z.life -= dt;
    if (P.fr.has) {
      if (Math.random() < dt * 20) spark(z.x + rnd(-z.r, z.r) * 0.6, z.y + rnd(-z.r, z.r) * 0.6, 1, fc().hex, 20, 0.5, 3, 30);
      for (const e of enemies) if (!e.dead && dist(z.x, z.y, e.x, e.y) < z.r + e.r) applyStatus(e, true);
    }
  }
  trails = trails.filter(z => z.life > 0);

  for (const d of drops) {
    d.life -= dt;
    if (state !== 'play') continue;
    const dd = dist(d.x, d.y, P.x, P.y);
    if (dd < 130) { d.x += (P.x - d.x) / dd * 260 * dt; d.y += (P.y - d.y) / dd * 260 * dt; }
    if (dd < 18) { d.life = 0; if (d.type === 'x') gainXp(d.v); else { P.beli += d.v; sfxCoin(); } }
  }
  drops = drops.filter(d => d.life > 0);

  if (storm) {
    storm.t += dt; storm.nb -= dt;
    if (storm.t > 0.15 && storm.t < 1.65) while (storm.nb <= 0) { storm.nb += 0.055; stormBolt(); }
    if (!storm.orbDone && storm.t >= 1.7) orbBoom();
    if (storm.t > 2.7) storm = null;
  }
  stormDim += ((storm && storm.t < 2.3 ? 0.4 : 0) - stormDim) * Math.min(1, dt * 5);
  flashA = Math.max(0, flashA - dt * 2.5);
  for (const b of bolts) b.life -= dt;
  bolts = bolts.filter(b => b.life > 0);
  for (const w of waves) w.life -= dt;
  waves = waves.filter(w => w.life > 0);
  for (const f of fx) { f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.96; f.vy *= 0.96; }
  fx = fx.filter(f => f.life > 0);
  if (fx.length > 500) fx.splice(0, fx.length - 500);
  for (const s of slashes) s.t -= dt;
  slashes = slashes.filter(s => s.t > 0);
  for (const x of texts) { x.life -= dt; x.y -= 30 * dt; }
  texts = texts.filter(x => x.life > 0);
  enemies = enemies.filter(e => !e.dead);
}

function drawTavern() {

    drawStrayFig({ x: v.x, y: v.y, face: Number(d.f) || 0, pal: MP_PAL[Math.abs(Number(d.c) | 0) % MP_PAL.length], punch: 0, flash: 0, name: cleanName(d.n) || 'guest', lv: Math.max(1, Number(d.lv) | 0), tag: 'フレンド' });
  }
}
/* ---------- loop ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
  last = ts;
  if (!portrait) { update(dt); draw(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
